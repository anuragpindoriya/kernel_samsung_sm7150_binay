name: m51

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 6'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kernelsu_version:
          - {url: "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh", name: KernelSU, version: KernelSU-v0.9.5, command: "-s v0.9.5", branch: stable}
          - {url: "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh", name: KernelSU-Next, version: KernelSU-Next, command: "-", branch: stable}
          - {url: "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh", name: KernelSU-Next, version: KernelSU-Next-SUS, command: "-s next-susfs-4.14", branch: susfs-supported}

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_DEFCONFIG: "m51_defconfig"
      KERNEL_CMDLINE: "ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"

    steps:
      # Checkout the repository and switch to the branch specified in the matrix
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ matrix.kernelsu_version.branch }}
          submodules: 'true'
          fetch-depth: 100

      # Set up ccache for build optimization
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.10

      # Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt install gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils make python3 ccache libssl-dev build-essential bc bison flex unzip libssl-dev ca-certificates xz-utils mkbootimg cpio device-tree-compiler git git-lfs jq -y
          curl -Ls $(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases/latest | grep "browser_download_url" | cut -d '"' -f 4) -o clang.tar.gz
          mkdir clang
          tar -xzvf clang.tar.gz -C clang

      # Get current timestamp
      - name: Get Time
        id: get_time
        run: echo "TIME=$(TZ=UTC-8 date +%m%d%H%M)" >> $GITHUB_ENV

      # Apply KernelSU version from matrix
      - name: Apply KernelSU Version
        run: |
          set -x
          rm -rf KernelSU
          rm -rf KernelSU-Next
          rm -rf drivers/kernelsu
          rm -rf drivers/KernelSU-Next
          curl -LSs "${{ matrix.kernelsu_version.url }}" | bash ${{ matrix.kernelsu_version.command }}

      # Setup environment for kernel compilation
      - name: Setup Environment For Kernel
        run: |
          export PATH=$(pwd)/proton-clang/bin/:$PATH
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export ARCH=arm64
          export SUBARCH=arm64
          export ANDROID_MAJOR_VERSION=r
          export KCFLAGS=-w

      # Create kernel name
      - name: Create Kernel Name
        run: |
          timestamp=$(TZ=UTC-8 date +%Y%m%d%H%M)
          file_tag="${{ matrix.kernelsu_version.version }}.${timestamp}"
          kernel_name_tag="${{ matrix.kernelsu_version.version }}"
          echo "FILE_TAG=$file_tag" >> $GITHUB_ENV
          echo "KERNEL_NAME_TAG=$kernel_name_tag" >> $GITHUB_ENV

      # Start kernel build
      - name: Start Build Kernel
        run: |
          make $KERNEL_CMDLINE $KERNEL_DEFCONFIG CC="ccache clang"
          make $KERNEL_CMDLINE CC="ccache clang" -j$(nproc --all) LOCALVERSION="-😍-An-UNKNOWN-${{ env.KERNEL_NAME_TAG }}-😍"

      # Pack kernel into AnyKernel3 zip
      - name: Pack Kernel Image In AnyKernel3
        run: |
          rm -rf out/AK3
          cp -r AK3 out/
          cp out/arch/arm64/boot/Image out/AK3/Image
          if [ -f out/arch/arm64/boot/dts/qcom/sdmmagpie.dtb ]; then
            cp out/arch/arm64/boot/dts/qcom/sdmmagpie.dtb out/AK3/dtb
          fi
          cd out/AK3
          zip -r9 An-UNKNOWN-${{ env.FILE_TAG }}-"$(/bin/date -u '+%Y%m%d-%H%M')".zip .

      # Release kernel to GitHub
      - name: Release Kernel TO GitHub
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          title: ${{ env.FILE_TAG }}
          automatic_release_tag: ${{ env.FILE_TAG }}
          prerelease: false
          files: |
            out/AK3/*.zip
            out/arch/arm64/boot/Image.gz

      # Upload kernel artifacts
      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4.0.0
        with:
          name: Kernel_Output_${{ matrix.kernelsu_version.version }}
          path: |
            out/arch
